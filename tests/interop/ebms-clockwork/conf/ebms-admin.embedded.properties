# Clockwork ebms-admin as an interop peer: plain HTTP ebMS endpoint, in-memory H2.
ebms.host=0.0.0.0
ebms.port=8888
ebms.path=/ebms
ebms.ssl=false
https.verifyHostnames=false
ebms.jdbc.driverClassName=org.h2.Driver
ebms.jdbc.url=jdbc:h2:mem:ebms;DB_CLOSE_DELAY=-1
ebms.jdbc.username=sa
ebms.jdbc.password=
ebms.jdbc.update=true
deliveryTaskHandler.default.executionInterval=500
