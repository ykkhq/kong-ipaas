name: ipaas

services:
  # One-shot: finds/creates the Konnect control plane, pins a DP certificate,
  # and writes cluster endpoints for kong-dp into the dp-certs volume.
  konnect-init:
    build: infra/konnect-init
    env_file: .env
    environment:
      OUT: /certs
    secrets:
      - konnect_pat
    volumes:
      - dp-certs:/certs
    restart: "no"

  # Local Kong data plane connected to Konnect. Runs the DataKit flows.
  kong-dp:
    image: kong/kong-gateway:${KONG_VERSION:-3.16}
    depends_on:
      konnect-init:
        condition: service_completed_successfully
    entrypoint: ["/ipaas-entrypoint.sh"]
    env_file:
      # Job secrets referenced by Secret nodes (IPAAS_SECRET_*). Optional.
      - path: secrets.env
        required: false
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_KONNECT_MODE: "on"
      KONG_VITALS: "off"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CERT: /certs/tls.crt
      KONG_CLUSTER_CERT_KEY: /certs/tls.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_NGINX_WORKER_PROCESSES: "2"
      # Containers started on demand (db-access) or recreated get new IPs; Docker DNS
      # answers with long TTLs, so keep Kong's DNS cache short (legacy + new client).
      KONG_DNS_VALID_TTL: "5"
      KONG_DNS_STALE_TTL: "10"
      KONG_RESOLVER_VALID_TTL: "5"
      KONG_RESOLVER_STALE_TTL: "10"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - dp-certs:/certs:ro
      - ./infra/kong-dp/entrypoint.sh:/ipaas-entrypoint.sh:ro
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
      - "${GATEWAY_TLS_PORT:-8443}:8443"
      - "${GATEWAY_STATUS_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ipaas
      POSTGRES_PASSWORD: ipaas
      POSTGRES_DB: ipaas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipaas"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Flow CRUD, DataKit compiler, Konnect deployer, test-run proxy.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://ipaas:ipaas@postgres:5432/ipaas
      DP_PROXY_URL: http://kong-dp:8000
      DP_STATUS_URL: http://kong-dp:8100
      MOCKS_URL: http://mocks:4010
      DB_ACCESS_IMAGE: ipaas-db-access:latest
      # Seeded once into Vault as connection "sample" (more: DB_CONN_<NAME> in .env).
      # After that, connections are managed in the UI and live only in Vault.
      DB_CONN_SAMPLE: ${DB_CONN_SAMPLE:-postgres://ipaas_app:app@sample-db:5432/sample}
      VAULT_ADDR: http://vault:8200
    secrets:
      - konnect_pat
    volumes:
      # Lets the API start the db-access container on demand.
      - /var/run/docker.sock:/var/run/docker.sock
      # Service tokens written by the Vault bootstrap (api: read/write, db-access: read-only).
      - vault-tokens:/vault/tokens:ro
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      db-access-image:
        condition: service_completed_successfully
    restart: unless-stopped

  # Flow designer UI (nginx serves the SPA and proxies /api).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"
    restart: unless-stopped

  # Sample job APIs used by the example flows.
  mocks:
    build:
      context: .
      dockerfile: apps/mocks/Dockerfile
    environment:
      MOCK_DELAY_MS: ${MOCK_DELAY_MS:-300}
    ports:
      - "${MOCKS_PORT:-4010}:4010"
    restart: unless-stopped

  # EDI protocols (SFTP, AS2; more to come): partners, listeners, message log.
  # Admin API on 4100 (UI via nginx /api/edi/, flows via /send); AS2 on 4080; SFTP on 2222.
  edi-gateway:
    build:
      context: .
      dockerfile: apps/edi-gateway/Dockerfile
    environment:
      DATABASE_URL: postgres://ipaas:ipaas@postgres:5432/ipaas
      VAULT_ADDR: http://vault:8200
      DP_PROXY_URL: http://kong-dp:8000
      # URL partners use for async MDNs (set to your host's reachable address).
      AS2_PUBLIC_URL: ${AS2_PUBLIC_URL:-http://localhost:4080/as2}
    volumes:
      - edi-data:/data
      - vault-tokens:/vault/tokens:ro
    ports:
      - "${AS2_PORT:-4080}:4080"
      - "${SFTP_PORT:-2222}:2222"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: unless-stopped

  # Builds the db-access image only. The API runs the container itself
  # (ipaas-db-access) once a flow uses a Database node, and keeps it running.
  db-access-image:
    build:
      context: .
      dockerfile: apps/db-access/Dockerfile
    image: ipaas-db-access:latest
    entrypoint: ["true"]
    restart: "no"

  # Local Vault for database connection strings (KV v2 at ipaas/db/<name>).
  # Initializes and unseals itself; see infra/vault/entrypoint.sh.
  vault:
    image: hashicorp/vault:${VAULT_VERSION:-1.20}
    entrypoint: ["/vault/config/entrypoint.sh"]
    cap_add: [IPC_LOCK]
    volumes:
      - ./infra/vault:/vault/config:ro
      - vault-file:/vault/file
      - vault-keys:/vault/keys
      - vault-tokens:/vault/tokens
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready && wget -qO- http://127.0.0.1:8200/v1/sys/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  # Stub Postgres 16 with sample data for Database nodes (connection "sample").
  sample-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: sample
    volumes:
      - sampledb:/var/lib/postgresql/data
      - ./infra/sample-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${SAMPLE_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample -d sample"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  dp-certs:
  pgdata:
  sampledb:
  vault-file:
  vault-keys:
  vault-tokens:
  edi-data:

secrets:
  # Konnect token, read from a file so it never lands in .env or the image.
  konnect_pat:
    file: ${KONNECT_PAT_FILE:-${HOME}/.kong/kpat}
